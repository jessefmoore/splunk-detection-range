# =============================================================================
# requirements.yml — Ludus blueprint dependency manifest for this range.
#
# Consumed by `ludus blueprint install <id>` once this range-config has been
# registered as a blueprint (see README.md "Using this repo as a Ludus
# Blueprint"). Versions confirmed against the live Ludus server this range
# was built on (pulled via `ludus blueprint config get` /
# blueprints/splunk-detection-range/requirements.yml) as of 2026-11-07.
#
# art_psmodule_prereq is listed with no installable version because it's a
# custom local role at roles/art_psmodule_prereq, not a Galaxy dependency —
# blueprint install/export/import can't fetch it. Install it directly from
# this repo instead:
#   ludus ansible role add -d roles/art_psmodule_prereq --force
# =============================================================================
roles:
  - name: art_psmodule_prereq
    version: "null"
  - name: frack113.ludus_caldera_agent
    version: v0.3.0
  - name: frack113.ludus_caldera_server
    version: v0.5.2
  - name: j91321.atomic_red_team
    version: main
  - name: p4t12ick.ludus_ar_splunk
    version: v1.1.3
  - name: p4t12ick.ludus_ar_windows
    version: v1.1.2
